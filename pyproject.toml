[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inter-agent-claude-code"
version = "0.2.0"
description = "Claude Code helper for the inter-agent message bus: connect a skill-driven Monitor listener and command-line tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Nicholas Moen", email = "arcanemachine@gmail.com" },
]
keywords = ["inter-agent", "messaging", "multi-agent", "coordination", "monitor", "channels"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications",
]
dependencies = [
  "inter-agent-core==0.2.0",
  "websockets==16.0",
]

[project.scripts]
inter-agent-claude = "inter_agent_claude.cli:main"

[project.urls]
Homepage = "https://github.com/arcanemachine/inter-agent-claude-code"
Repository = "https://github.com/arcanemachine/inter-agent-claude-code"
Issues = "https://github.com/arcanemachine/inter-agent-claude-code/issues"

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.12",
  "black==26.3.1",
  "mypy==1.20.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.data-files]
"share/inter-agent-claude-code/.claude-plugin" = [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json"]
"share/inter-agent-claude-code/skills/inter-agent" = ["skills/inter-agent/SKILL.md", "skills/inter-agent/bootstrap.md"]
"share/inter-agent-claude-code/skills/inter-agent/bin" = ["skills/inter-agent/bin/inter-agent-claude", "skills/inter-agent/bin/bootstrap-runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false